<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科学营 第一课后练习</title>
<!-- 换成国内可访问镜像 -->
<script src="https://jsd.onmicrosoft.cn/npm/pdfjs-dist@3.4.120/build/pdf.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#eeeeee;padding:16px}
h2{text-align:center;margin-bottom:16px;color:#222}
#pdf-box{display:flex;flex-direction:column;gap:16px;align-items:center;}
canvas{background:#ffffff;box-shadow:0 2px 12px rgba(0,0,0,0.15);}
.error{color:red;font-size:18px;text-align:center;margin-top:40px;}
</style>
</head>
<body>
<h2>科学营 第一课后练习</h2>
<div id="pdf-box"></div>

<script>
const pdfjsLib = window['pdfjs-dist/build/pdf'];
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://jsd.onmicrosoft.cn/npm/pdfjs-dist@3.4.120/build/pdf.worker.min.js";

const pdfFileUrl = "./homework.pdf";
const container = document.getElementById("pdf-box");

pdfjsLib.getDocument(pdfFileUrl).promise.then(async (pdfDocument)=>{
    for(let page = 1; page <= pdfDocument.numPages; page++){
        const pageObj = await pdfDocument.getPage(page);
        const viewport = pageObj.getViewport({scale:1.3});
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        container.appendChild(canvas);
        await pageObj.render({canvasContext:ctx, viewport:viewport}).promise;
    }
}).catch(err=>{
    container.innerHTML = `<div class="error">PDF加载失败：${err.message}</div>`
})
</script>
</body>
</html>
